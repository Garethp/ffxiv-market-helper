name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # A pull request is only deployed once it's labelled `deploy-pr`, and then again with each push to
  # it while it keeps the label. Pages has one site, so this replaces what main deployed until main
  # is next deployed.
  pull_request:
    types: [opened, labeled, synchronize, reopened]
  # So a deploy can be re-run from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. In-progress runs are left to finish rather than cancelled, so a
# half-uploaded site never becomes the live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Adding some other label to a pull request that already has `deploy-pr` doesn't deploy it again.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'deploy-pr') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy-pr'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: corepack enable

      - run: yarn install --immutable

      # Tells us the URL the site will be served from, so the repo name isn't hardcoded anywhere.
      - id: pages
        uses: actions/configure-pages@v6

      - run: yarn build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
